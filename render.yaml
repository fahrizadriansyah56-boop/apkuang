services:
  - type: web
    name: kaspanitia-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run lint && npm run lint:api && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kaspanitia-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost

databases:
  - name: kaspanitia-db
    databaseName: kaspanitia
    user: kaspanitia
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
